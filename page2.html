<style>

</div>

<span class="absolute bottom-0 -left-6 material-symbols-outlined text-secondary opacity-40">celebration</span>
</div>

                    </p>

<!-- Bento-style Meta Info Card -->

<span class="material-symbols-outlined text-xl">add_circle</span>

</div>

<script>
        // Micro-interaction: Hover effects for buttons
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('mouseenter', () => {
                button.classList.add('transition-transform', 'duration-150');
            });
        });

        // Simulating some light movement on the background blobs
        const blobs = document.querySelectorAll('.blur-3xl');
        window.addEventListener('mousemove', (e) => {
            const x = e.clientX / window.innerWidth;
            const y = e.clientY / window.innerHeight;
            blobs.forEach((blob, index) => {
                const shift = (index + 1) * 20;
                blob.style.transform = `translate(${x * shift}px, ${y * shift}px)`;
            });
        });
    </script>
